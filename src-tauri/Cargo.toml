[package]
name = "picview"
version = "2.0.0"
description = "起動が速い、UIの消える画像ビューア"
authors = ["stiz"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "picview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
trash = "5"
notify = "8"
notify-debouncer-mini = "0.7"
arboard = { version = "3", default-features = false, features = ["image-data"] }

# WebView が直接デコードできない形式（tiff/tga/dds/pnm/qoi/hdr/ico）だけを
# Rust 側で PNG へ変換するために使う。png/jpeg/gif/webp/bmp は WebView に任せるが、
# サムネイル生成には必要なのでデコーダは有効にしておく。
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
  "gif",
  "webp",
  "bmp",
  "ico",
  "tiff",
  "tga",
  "dds",
  "hdr",
  "pnm",
  "qoi",
  "rayon",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
